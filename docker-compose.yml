# Full stack: PostgreSQL, the Node API (REST + Socket.IO) and the React app
# served by nginx. Open http://localhost:8080 once everything is healthy.
#
# Secrets come from a root .env file (see .env.example); compose refuses to
# start without them.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ops_dashboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published for local tooling (migrations, seeding, psql).
      - '${DB_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ops} -d ${POSTGRES_DB:-ops_dashboard}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ops_dashboard}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./client
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
